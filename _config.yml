name: Living Mountains Lab
description: >
  Living Mountains Lab. Observing, modeling and forecasting a changing
  mountain world.
url: https://livingmountains.github.io

exclude: [README.md, PHOTOS-NEEDED.md, scripts]

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html

# Sections on the "people" page.
roles:
  - key: member
    name: Members

# Number of news stories on the front page.
front_page_news: 8

# Base pathname for links.
# The site is the organization page https://livingmountains.github.io,
# so the base is empty. (It was '/mhydro' at geokshitij.github.io/mhydro.)
# If you later move the site to an
# organization root (e.g. https://mountainhydrology.github.io), set this to ''.
base: ''

# make pages for the _projects folder
collections:
  projects:
    output: true

# Navigation bar links.
navigation:
  - title: Home
    link: /
  - title: People
    link: /people.html
  - title: Research
    link: /research.html
  - title: Field
    link: /fieldwork.html
  - title: Publications
    link: /publications.html
  - title: Media
    link: /media.html
